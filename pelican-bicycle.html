<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <title>顺风骑行 · A Pelican's Day Out</title>
  <style>
    :root { color-scheme: light; --paper:#f5f2e9; --ink:#253f43; --muted:#758481; --orange:#e88347; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { max-width:1240px; margin:auto; padding:34px 48px 24px; }
    header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #253f4325; padding-bottom:20px; }
    .brand { font-size:12px; letter-spacing:3px; font-weight:700; display:flex; align-items:center; gap:12px; }
    .brand-mark { width:24px; height:24px; border:1px solid var(--ink); border-radius:50%; display:grid; place-items:center; font-size:15px; }
    .edition { font-size:10px; letter-spacing:2px; color:var(--muted); }
    .intro { text-align:center; margin:44px 0 0; }
    .eyebrow { font-size:10px; letter-spacing:4px; color:#8a7760; }
    h1 { font-size:clamp(34px,5vw,62px); letter-spacing:8px; font-weight:500; margin:14px 0 12px; }
    .intro p { font-size:13px; color:var(--muted); letter-spacing:2px; margin:0; }
    .scene { position:relative; margin:12px -20px 0; }
    .scene > svg { display:block; width:100%; height:auto; overflow:hidden; }
    .controls { display:flex; align-items:center; justify-content:center; gap:24px; margin:8px 0 40px; }
    button { font:inherit; cursor:pointer; }
    #toggle { display:flex; align-items:center; gap:10px; padding:12px 20px; background:var(--ink); color:var(--paper); border:0; border-radius:30px; font-size:12px; letter-spacing:1px; }
    #toggle:hover { background:#3b5e60; }
    #toggle:focus-visible, input:focus-visible { outline:3px solid var(--orange); outline-offset:5px; }
    #toggle svg { width:12px; height:12px; }
    .speed { display:flex; gap:12px; align-items:center; color:var(--muted); font-size:11px; }
    input { width:100px; accent-color:var(--orange); cursor:pointer; }
    output { font-variant-numeric:tabular-nums; width:28px; color:var(--ink); }
    footer { border-top:1px solid #253f4325; padding-top:18px; display:flex; align-items:center; justify-content:space-between; font-size:10px; letter-spacing:1.5px; color:var(--muted); }
    .live { display:inline-block; width:6px; height:6px; background:#69a79b; border-radius:50%; margin-right:8px; }
    @media(max-width:600px) {
      main { padding:22px 20px; } .edition { font-size:8px; letter-spacing:1px; }
      .brand { font-size:10px; letter-spacing:1.5px; } .intro { margin-top:36px; }
      h1 { letter-spacing:5px; } .intro p { font-size:11px; letter-spacing:1px; }
      .scene { margin:28px -20px 18px; } .controls { gap:18px; margin-bottom:30px; }
      footer { font-size:8px; letter-spacing:.5px; } input { width:74px; }
    }
  </style>
</head>
<body>
<main>
  <header><div class="brand"><span class="brand-mark">↗</span> LITTLE WANDERER</div><span class="edition">动 画 小 品 &nbsp; / &nbsp; NO. 001</span></header>
  <div class="intro"><div class="eyebrow">A PELICAN'S DAY OUT</div><h1>今天，顺风。</h1><p>不赶时间，只追海风。</p></div>
  <div class="scene">
    <svg id="landscape" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">鹈鹕骑着自行车，在海边悠闲前行</title>
      <desc id="scene-desc">白色鹈鹕戴着绿色小帽、系着橙色围巾，踩着青绿色自行车。车轮旋转，双脚交替踩踏，云朵和海边小草向后移动。下方可以暂停动画或调整速度。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e9eee5"/><stop offset="1" stop-color="#f5f2e9"/></linearGradient>
        <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#aecdc5"/><stop offset="1" stop-color="#d4dfcc"/></linearGradient>
        <clipPath id="vista"><path d="M100 424V246C100 117 265 52 560 52S1020 117 1020 246V424Z"/></clipPath>
        <g id="cloud" fill="#fffdf6"><path d="M0 21C0 11 12 5 23 9C28-6 52-5 59 8C74 4 84 12 84 21Z"/></g>
        <g id="grass" fill="none" stroke="#8b9d79" stroke-width="2.5" stroke-linecap="round"><path d="M0 0q-2-13-10-19M0 0q0-21 7-27M0 0q6-12 15-13"/></g>
        <g id="spokes" fill="none" stroke="#829591" stroke-width="1.5">
          <path d="M-76 0H76M0-76V76M-53.74-53.74L53.74 53.74M-53.74 53.74L53.74-53.74M-70.22-29.08L70.22 29.08M-29.08-70.22L29.08 70.22M-70.22 29.08L70.22-29.08M-29.08 70.22L29.08-70.22"/>
          <circle r="68" stroke="#ebe5d5" stroke-width="2"/><path d="M-6-68H6" stroke="#e88347" stroke-width="5" stroke-linecap="round"/>
        </g>
      </defs>
      <g clip-path="url(#vista)">
        <path fill="url(#sky)" d="M80 40h960v390H80z"/>
        <circle cx="810" cy="135" r="49" fill="#edc880"/>
        <circle cx="810" cy="135" r="62" fill="none" stroke="#edc880" opacity=".22"/>
        <g id="clouds"><use href="#cloud" x="195" y="154"/><use href="#cloud" x="580" y="102" transform="translate(70 20) scale(.8)"/><use href="#cloud" x="960" y="185"/></g>
        <path d="M60 302Q170 268 290 297T540 291T810 298T1090 282V425H60Z" fill="#c1d3c5"/>
        <path d="M60 328Q210 308 400 325T720 321T1090 319V428H60Z" fill="url(#sea)"/>
        <g stroke="#f6f6e9" stroke-width="2" stroke-linecap="round" opacity=".65"><path d="M135 349h92m48 17h43m396-22h103m31 26h76M360 342h30m163 42h82m-431 12h66"/></g>
        <path d="M50 418Q270 384 480 411T1070 398V461H50Z" fill="#e6dfc7"/>
        <g id="distant-birds" fill="none" stroke="#6f8c87" stroke-width="2" stroke-linecap="round"><path d="M330 158q8-8 16 0q8-8 16 0M367 139q5-5 10 0q5-5 10 0"/></g>
      </g>
      <path d="M78 444H1042" stroke="#bdc2af" stroke-width="2" stroke-linecap="round"/>
      <path d="M108 452H1012" stroke="#fffaf0" stroke-width="3" stroke-linecap="round"/>
      <g id="road" fill="none" stroke="#c9c6b5" stroke-width="2" stroke-linecap="round"></g>
      <g id="plants"></g>
      <ellipse id="shadow" cx="553" cy="446" rx="206" ry="12" fill="#526452" opacity=".10"/>
      <g id="rider" stroke-linecap="round" stroke-linejoin="round">
        <!-- The far leg sits behind the bicycle frame. -->
        <path id="far-leg" d="M494 296L532 325L550 374" fill="none" stroke="#b87f43" stroke-width="12"/>
        <path id="far-foot" fill="#ce9148" stroke="#9f713d" stroke-width="2"/>
        <g transform="translate(410 360)">
          <circle r="84" fill="#f5f2e9" fill-opacity=".35" stroke="#293f42" stroke-width="10"/>
          <circle r="77" fill="none" stroke="#e4dac4" stroke-width="4"/>
          <g id="back-wheel"><use href="#spokes"/></g><circle r="7" fill="#e0bc79" stroke="#293f42" stroke-width="3"/>
        </g>
        <g transform="translate(711 360)">
          <circle r="84" fill="#f5f2e9" fill-opacity=".35" stroke="#293f42" stroke-width="10"/>
          <circle r="77" fill="none" stroke="#e4dac4" stroke-width="4"/>
          <g id="front-wheel"><use href="#spokes"/></g><circle r="7" fill="#e0bc79" stroke="#293f42" stroke-width="3"/>
        </g>
        <!-- Frame, chain, mudguards and handlebar. -->
        <path d="M335 321A84 84 0 0 1 476 307M645 308A84 84 0 0 1 786 321" fill="none" stroke="#6b9890" stroke-width="5"/>
        <path d="M410 352L548 340A20 20 0 0 1 548 380L410 368A8 8 0 0 1 410 352Z" fill="none" stroke="#82918a" stroke-width="2"/>
        <path d="M410 360L476 252L548 360H410L660 252H476M548 360L660 252L711 360" fill="none" stroke="#285e5c" stroke-width="11"/>
        <path d="M410 360L476 252L548 360M483 253H654" fill="none" stroke="#75ada1" stroke-width="3"/>
        <path d="M476 252L466 231M660 252L644 209Q641 201 651 198L679 192Q695 190 695 203Q695 213 683 213" fill="none" stroke="#344d4d" stroke-width="7"/>
        <path d="M680 192Q695 190 695 203Q695 213 683 213" fill="none" stroke="#b77a4c" stroke-width="8"/>
        <path d="M441 233Q438 224 449 223L488 226Q498 227 493 233Z" fill="#805b42" stroke="#344d4d" stroke-width="3"/>
        <circle cx="548" cy="360" r="21" fill="#ede4ce" stroke="#344d4d" stroke-width="4"/>
        <g id="crank"><path d="M-27 0H27" stroke="#344d4d" stroke-width="5"/></g>
        <circle cx="548" cy="360" r="5" fill="#344d4d"/>
        <!-- Pelican: long bill, deep throat pouch and folded wing. -->
        <g id="bird-body">
          <path d="M444 246L391 209L409 244L382 235Q400 264 440 271" fill="#fdfbf1" stroke="#344d4d" stroke-width="3"/>
          <path d="M441 220Q469 191 530 208Q555 196 558 165L556 140Q556 105 584 98Q617 91 630 116Q643 145 616 163Q604 172 609 201Q612 248 568 280Q527 308 478 285Q442 272 441 220Z" fill="#fdfbf1" stroke="#344d4d" stroke-width="3"/>
          <path d="M588 165Q572 205 587 227Q572 268 530 276Q496 286 471 268Q517 306 568 280Q612 248 609 201Q604 172 616 163Z" fill="#e5e7d9"/>
          <path d="M476 227Q507 209 552 224Q557 250 523 271Q495 275 469 251" fill="#e9ecdf" stroke="#728985" stroke-width="2.5"/>
          <path d="M484 240Q507 250 532 238M482 251Q500 260 517 251" fill="none" stroke="#a2b1a6" stroke-width="2"/>
          <path d="M617 139L736 145Q714 182 666 182Q632 180 617 153Z" fill="#efb965" stroke="#344d4d" stroke-width="2.5"/>
          <path d="M618 132Q670 127 750 143Q755 146 744 150L619 149Z" fill="#e99546" stroke="#344d4d" stroke-width="2.5"/>
          <path d="M630 143L730 145" fill="none" stroke="#f7ce7e" stroke-width="2"/>
          <circle cx="607" cy="124" r="8" fill="#ede7c8"/>
          <g id="eye"><circle cx="609" cy="124" r="4.5" fill="#253f43"/><circle cx="610.5" cy="122.5" r="1.3" fill="white"/></g>
          <path d="M598 109Q605 105 612 109" fill="none" stroke="#344d4d" stroke-width="2"/>
          <path d="M556 107Q553 77 580 78Q606 77 614 100" fill="#518b7c" stroke="#344d4d" stroke-width="2.5"/>
          <path d="M550 107Q583 96 625 103" fill="none" stroke="#344d4d" stroke-width="5"/>
          <path d="M567 86L573 97" stroke="#8cb7a1" stroke-width="3"/>
          <path id="scarf-tail" d="M572 181Q535 172 517 190L487 181L499 201Q539 205 576 192Z" fill="#df7948" stroke="#a95c3d" stroke-width="2"/>
          <path d="M558 175Q577 185 606 171L609 185Q581 201 557 190Z" fill="#e88347" stroke="#a95c3d" stroke-width="2"/>
          <path d="M553 224Q589 248 650 205" fill="none" stroke="#344d4d" stroke-width="15"/>
          <path d="M553 224Q589 248 650 205" fill="none" stroke="#f9f8ec" stroke-width="11"/>
          <path d="M643 208L654 200" stroke="#e4a553" stroke-width="8"/>
        </g>
        <path id="near-leg" d="M522 282L500 327L575 360" fill="none" stroke="#344d4d" stroke-width="14"/>
        <path id="near-leg-fill" d="M522 282L500 327L575 360" fill="none" stroke="#e5a751" stroke-width="10"/>
        <path id="near-foot" fill="#edb357" stroke="#344d4d" stroke-width="2.5"/>
        <path id="near-pedal" stroke="#344d4d" stroke-width="6"/>
      </g>
      <g fill="#8a9688" font-family="Arial, sans-serif" font-size="10" letter-spacing="3"><text x="130" y="509">COASTAL ROUTE</text><text x="978" y="509" text-anchor="end">→ &nbsp; ANYWHERE</text></g>
      <g fill="none" stroke="#9caaa0" stroke-width="2" stroke-linecap="round"><path id="wind-a" d="M324 246h-37m24 11h-57"/><path id="wind-b" d="M779 244h35m-17 12h40"/></g>
    </svg>
  </div>
  <div class="controls">
    <button id="toggle" type="button" aria-label="暂停动画"><svg viewBox="0 0 12 12" aria-hidden="true"><path id="button-icon" fill="currentColor" d="M2 1h3v10H2zM7 1h3v10H7z"/></svg><span id="button-label">歇一会儿</span></button>
    <label class="speed" for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speed-value" for="speed">1×</output></label>
  </div>
  <footer><span><span class="live"></span>慢一点，也会到达。</span><span>MADE OF SIMPLE LINES & SEA BREEZE</span></footer>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const ns = 'http://www.w3.org/2000/svg';
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reducedMotion.matches, speed = 1, time = 0, last = null;
  const grass = [], dashes = [];
  for (let i = 0; i < 8; i++) {
    const plant = document.createElementNS(ns, 'use');
    plant.setAttribute('href', '#grass'); $('plants').appendChild(plant); grass.push(plant);
  }
  for (let i = 0; i < 13; i++) {
    const dash = document.createElementNS(ns, 'path'); $('road').appendChild(dash); dashes.push(dash);
  }
  function footPath(x, y) {
    return `M${x-9} ${y-5}Q${x+1} ${y-9} ${x+10} ${y-3}L${x+22} ${y+4}L${x-10} ${y+4}Z`;
  }
  function draw(t) {
    const angle = t * 3.6, deg = angle * 180 / Math.PI;
    const bob = Math.sin(angle * 2) * 1.4;
    $('rider').setAttribute('transform', `translate(0 ${bob})`);
    $('back-wheel').setAttribute('transform', `rotate(${deg * 1.7})`);
    $('front-wheel').setAttribute('transform', `rotate(${deg * 1.7})`);
    $('crank').setAttribute('transform', `translate(548 360) rotate(${deg})`);
    const x = 548 + 27 * Math.cos(angle), y = 360 + 27 * Math.sin(angle);
    const fx = 548 - 27 * Math.cos(angle), fy = 360 - 27 * Math.sin(angle);
    // Solve a two-segment leg so both feet stay attached to the crank.
    function leg(hx, hy, px, py, bend) {
      const dx = px-hx, dy = py-hy, d = Math.hypot(dx,dy);
      const upper = 65, lower = 65;
      const along = (upper*upper-lower*lower+d*d)/(2*d);
      const height = Math.sqrt(Math.max(0,upper*upper-along*along));
      const kx = hx+along*dx/d+bend*height*(-dy/d);
      const ky = hy+along*dy/d+bend*height*(dx/d);
      return `M${hx} ${hy}L${kx} ${ky}L${px} ${py}`;
    }
    $('far-leg').setAttribute('d',leg(494,278,fx,fy, -1));
    $('far-foot').setAttribute('d',footPath(fx,fy));
    const near = leg(522,282,x,y,1);
    $('near-leg').setAttribute('d',near); $('near-leg-fill').setAttribute('d',near);
    $('near-foot').setAttribute('d',footPath(x,y));
    $('near-pedal').setAttribute('d',`M${x-12} ${y+7}h31`);
    $('scarf-tail').setAttribute('transform',`rotate(${Math.sin(t*8)*5} 574 186)`);
    const blink = t % 5.3;
    $('eye').setAttribute('transform',`translate(609 124) scale(1 ${blink>5.12 ? .12 : 1}) translate(-609 -124)`);
    $('clouds').setAttribute('transform',`translate(${-((t*9)%1180)} 0)`);
    // A second cloud strip makes the background loop without an empty interval.
    cloudCopy.setAttribute('transform',`translate(${1180-((t*9)%1180)} 0)`);
    grass.forEach((plant,i) => {
      const px = 85 + ((i*139-t*112)%1112+1112)%1112;
      plant.setAttribute('transform',`translate(${px} ${i%2 ? 468 : 430}) scale(${i%2 ? .65 : .48})`);
      plant.setAttribute('opacity',px>1030 || px<100 ? '0' : '.8');
    });
    dashes.forEach((dash,i) => {
      const px = 100+((i*79-t*112)%1027+1027)%1027;
      dash.setAttribute('d',`M${px} ${i%2 ? 467 : 480}h${i%3 ? 15 : 29}`);
      dash.setAttribute('opacity',px>995 ? '0' : '.6');
    });
    $('wind-a').setAttribute('opacity',.3+.4*(1+Math.sin(t*3))/2);
    $('wind-b').setAttribute('opacity',.2+.4*(1+Math.cos(t*3))/2);
  }
  const cloudCopy = $('clouds').cloneNode(true);
  cloudCopy.removeAttribute('id'); $('clouds').after(cloudCopy);
  function updateButton() {
    $('toggle').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
    $('button-label').textContent = playing ? '歇一会儿' : '继续兜风';
    $('button-icon').setAttribute('d',playing ? 'M2 1h3v10H2zM7 1h3v10H7z' : 'M3 1l8 5-8 5z');
  }
  $('toggle').addEventListener('click',() => { playing=!playing; updateButton(); });
  $('speed').addEventListener('input',e => { speed=Number(e.target.value); $('speed-value').textContent=`${speed}×`; });
  reducedMotion.addEventListener('change',e => { playing=!e.matches; updateButton(); });
  document.addEventListener('visibilitychange',() => { last=null; });
  function frame(now) {
    if(last!==null && playing) { time += Math.min((now-last)/1000,.05)*speed; draw(time); }
    last=now; requestAnimationFrame(frame);
  }
  draw(0); updateButton(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
